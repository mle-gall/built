[package]
name = "ingetrazo_render"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
built_python_bindings = { path = "../python_bindings" }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
wgpu = { version = "24", features = ["vulkan-portability"] }
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
egui = { version = "0.31.1", default-features = false }
egui-wgpu = { version = "0.31.1", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga", "pnm", "ico", "tiff", "gif"] }

flate2 = "1"
crc32fast = "1"
resvg = "0.45"
svgtypes = "0.15"
rustybuzz = "0.20"
kurbo = "0.11"
unicode-bidi = "0.3"
unicode-script = "0.5"

[features]
extension-module = ["pyo3/extension-module"]

# serde: also the large sheet's spec (ui/large_sheet.rs), JSON from Python.
[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.png]
version = "0.18"

[dev-dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSEnumerator", "NSURL", "NSLocale", "NSFileManager", "NSPathUtilities"] }
core-foundation = "0.9"
core-graphics = "0.23"
foreign-types = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Globalization", "Win32_UI_Shell"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dev-dependencies]
libloading = "0.8"
