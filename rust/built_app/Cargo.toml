[package]
name = "built_app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Built: the Rust app shell (winit + wgpu renderer + embedded Python)"

[[bin]]
name = "built"
path = "src/main.rs"

[dependencies]
# The renderer and its egui chrome, linked in and registered as the
# built-in `ingetrazo_render` Python module (src/python.rs).
ingetrazo_render = { path = "../ingetrazo_render" }
pyo3 = { version = "0.29", features = ["auto-initialize"] }
winit = "0.30"
raw-window-handle = "0.6"
rfd = "0.18"

[build-dependencies]
cc = "1"

# AppKit pieces winit 0.30 does not expose: the modal pump, the pasteboard,
# Open With and Dock quit on winit's own app delegate (src/native.rs).
# Versions as already locked through muda.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDate", "NSArray", "NSURL", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSLocale", "NSFileManager", "NSPathUtilities"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSTouch", "NSEvent", "NSView", "NSWindow", "NSPasteboard", "NSRunningApplication", "NSGraphics", "NSGraphicsContext", "NSColor"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
x11rb = { version = "0.13", features = ["xinput"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_Globalization", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Console"] }

[dev-dependencies]
png = "0.18"
serde_json = "1"

[[test]]
name = "mac_menu_tree"
harness = false

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "unstable"] }
