[package]
name = "built_app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Built: the Rust app shell (winit + wgpu renderer + embedded Python)"

[[bin]]
name = "built"
path = "src/main.rs"

[dependencies]
# The renderer and its egui chrome, linked in and registered as the
# built-in `ingetrazo_render` Python module (src/python.rs).
ingetrazo_render = { path = "../ingetrazo_render" }
pyo3 = { version = "0.29", features = ["auto-initialize"] }
winit = "0.30"
raw-window-handle = "0.6"
rfd = "0.18"
muda = "0.21"
png = "0.18"

[build-dependencies]
cc = "1"

# AppKit pieces winit 0.30 does not expose: the modal pump, the pasteboard,
# Open With and Dock quit on winit's own app delegate (src/native.rs).
# Versions as already locked through muda.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDate", "NSArray", "NSURL", "NSGeometry", "NSObjCRuntime", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent", "NSView", "NSWindow", "NSPasteboard", "NSRunningApplication", "NSGraphics", "NSGraphicsContext"] }
