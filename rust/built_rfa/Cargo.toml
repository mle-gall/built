[package]
name = "built_rfa"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = ".rfa family reader for Built, on rvt-rs (optional: the importer reports it missing)"
publish = false

[lib]
name = "built_rfa"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
anyhow = "1"
base64 = "0.22"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
# rvt-rs (Apache-2.0) with its research readers. A sibling checkout of
# rvt-rs at ../../../rvt-rs, branch ingetrazo/rfa-family (saved-graphics
# style per primitive).
rvt = { path = "../../../rvt-rs", features = ["unstable-research"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
