[package]
name = "ingetrazo_core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native kernels for IngeTrazo's heavy computations (optional: Python falls back)"
publish = false

[lib]
name = "ingetrazo_core"
crate-type = ["cdylib"]

[dependencies]
glam = "0.29.3"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
rayon = "1.12.0"
crc32fast = "1.4"
zmij = "1.0.23"
flate2 = "1.1"
i_overlay = "9.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies.serde_json]
version = "1"
features = ["arbitrary_precision", "raw_value"]

[dependencies.serde]
version = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSProcessInfo"] }
