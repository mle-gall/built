[package]
name = "ingetrazo_core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native kernels for IngeTrazo's heavy computations (optional: Python falls back)"
publish = false

[lib]
name = "ingetrazo_core"
crate-type = ["cdylib"]

[dependencies]
glam = "0.29.3"
numpy = "0.29"
# No `extension-module` here: maturin builds the wheel as an extension
# (PYO3_BUILD_EXTENSION_MODULE) and `cargo test` links libpython. The
# feature stays for builds that ask for it explicitly.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
rayon = "1.12.0"
crc32fast = "1.4"
zmij = "1.0.23"
flate2 = "1.1"
i_overlay = "9.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
regex = "1.12"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies.serde_json]
version = "1"
features = ["arbitrary_precision", "raw_value"]

[dependencies.serde]
version = "1"
features = ["derive"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSProcessInfo"] }
core-foundation = "0.9"
core-foundation-sys = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
