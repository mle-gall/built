name: Built CI
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: pytest selection to run alone (empty runs the whole workflow)
        default: ''
      os:
        description: runners, as a JSON list
        default: '["macos-latest"]'

permissions:
  contents: read

concurrency:
  group: built-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # A minute on its own, before the long builds: a stale UI string
  # inventory fails here with the command that refreshes it.
  inventory:
    name: UI string inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare the inventory with the sources
        run: python scripts/translation_coverage.py --inventory-only

  verify:
    needs: inventory
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.tests && inputs.os || '["macos-latest", "ubuntu-latest", "windows-latest"]') }}
    defaults:
      run:
        shell: bash
        working-directory: built
    steps:
      - uses: actions/checkout@v4
        with:
          path: built
          persist-credentials: false

      - name: Check out the RFA reader source
        if: runner.os != 'Linux'
        uses: actions/checkout@v4
        with:
          repository: DrunkOnJava/rvt-rs
          ref: 62cc17e0d8bc8781cfab482ca50e8216e0a3ce1d
          path: rvt-rs
          persist-credentials: false

      - name: Apply Built's saved-graphics style support
        if: runner.os != 'Linux'
        run: git -C ../rvt-rs apply ../built/.github/ci/rfa-family.patch

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: ${{ runner.os != 'Windows' && 'pip' || '' }}
          cache-dependency-path: built/requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('built/rust/*/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      # The compiled crates, by toolchain, lock files and everything the
      # crates compile in (their sources, and the resources and fixtures
      # they include).
      # An exact match was built from these very sources, so they are marked
      # older than it and nothing compiles. A match on the lock files alone
      # keeps the dependencies and compiles Built's own crates again.
      - name: Key the compiled crates
        id: crates
        if: runner.os != 'Windows'
        run: |
          echo "toolchain=$(rustc -Vv | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          # The .rfa reader is a path dependency, pinned by its commit and our patch.
          if [[ -d ../rvt-rs ]]; then
            echo "reader=$( { git -C ../rvt-rs rev-parse HEAD; shasum -a 256 .github/ci/rfa-family.patch; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          else
            echo "reader=none" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache/restore@v4
        id: target
        if: runner.os != 'Windows'
        with:
          path: built/rust/built_app/target
          key: target-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.crates.outputs.toolchain }}-${{ steps.crates.outputs.reader }}-${{ hashFiles('built/rust/*/Cargo.lock') }}-${{ hashFiles('built/rust/**', '!built/rust/**/target/**', 'built/resources/**', 'built/tests/fixtures/**', 'built/AUTHORS', 'built/scripts/build_native.sh') }}
          restore-keys: target-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.crates.outputs.toolchain }}-${{ steps.crates.outputs.reader }}-${{ hashFiles('built/rust/*/Cargo.lock') }}-

      # A fresh checkout dates every file now, which would make cargo compile
      # what the cache already holds. The reader's sources are in the key
      # whenever anything was restored; Built's own only on an exact match.
      - name: Mark unchanged sources as built
        if: runner.os != 'Windows' && steps.target.outputs.cache-matched-key != ''
        run: |
          if [[ -d ../rvt-rs ]]; then
            git -C ../rvt-rs ls-files -z | (cd ../rvt-rs && xargs -0 touch -h -t 200001010000)
          fi
          if [[ "${{ steps.target.outputs.cache-hit }}" == true ]]; then
            git ls-files -z rust resources tests/fixtures AUTHORS | xargs -0 touch -h -t 200001010000
          fi

      - name: Isolate the application profile
        run: |
          python - <<'PY'
          import os, subprocess, sys, tempfile
          from pathlib import Path
          home = Path.home()
          profile = tempfile.mkdtemp()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in {
                  "CARGO_TARGET_DIR": Path.cwd() / "rust/built_app/target",
                  "CARGO_HOME": os.environ.get("CARGO_HOME", home / ".cargo"),
                  "RUSTUP_HOME": os.environ.get("RUSTUP_HOME", home / ".rustup"),
                  "PIP_CACHE_DIR": subprocess.check_output(
                      [sys.executable, "-m", "pip", "cache", "dir"], text=True).strip(),
                  "HOME": profile, "CFFIXED_USER_HOME": profile,
                  "BUILT_SETTINGS_DIR": tempfile.mkdtemp(), "BUILT_BACKGROUND": "1",
                  "PYO3_PYTHON": sys.executable if os.name == "nt" else Path.cwd() / ".venv/bin/python",
              }.items():
                  print(f"{key}={value}", file=env)
          PY

      - name: Linux build and offscreen renderer dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwayland-dev libvulkan1 mesa-vulkan-drivers

      - name: Check every crate for Windows MSVC
        if: runner.os == 'Windows'
        run: |
          for crate in built_core built_render built_rfa built_app; do
            cargo check --locked --target x86_64-pc-windows-msvc --manifest-path "rust/$crate/Cargo.toml"
          done
          cargo check --target x86_64-pc-windows-msvc --manifest-path rust/python_bindings/Cargo.toml

      - name: Build release wheels
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          # A new environment each run: its interpreter must not look newer
          # than crates compiled against the same one in an earlier run.
          touch -h -t 200001010000 .venv/bin/python* .venv/pyvenv.cfg
          if [[ "${{ steps.target.outputs.cache-hit }}" == true ]]; then
            export CARGO_LOG=cargo::core::compiler::fingerprint=info    # say why, if anything compiles
          fi
          .venv/bin/python -m pip install -r requirements.txt pillow pymupdf ifctester
          if [[ "$RUNNER_OS" == macOS ]]; then
            test "$(uname -m)" = arm64
            .venv/bin/python -m pip install pyinstaller ifcopenshell
            VENV=.venv scripts/build_native.sh --with-launcher
          else
            VENV=.venv scripts/build_native.sh
          fi

      - name: Report UI translation coverage
        if: runner.os != 'Windows'
        run: PYTHONPATH=. .venv/bin/python scripts/translation_coverage.py

      - name: Verify native modules and select the release launcher
        if: runner.os == 'macOS'
        run: |
          .venv/bin/python -c 'import built_core, built_render, built_rfa'
          echo "BUILT_BINARY=$PWD/rust/built_app/target/release/built" >> "$GITHUB_ENV"

      - name: Run the full macOS suite
        if: runner.os == 'macOS'
        run: |
          swift .github/ci/window-session.swift configure || true
          if available=$(swift .github/ci/window-session.swift); then
            echo "::notice::Display offers $available points for scripted windows."
            export BUILT_CI_WINDOW_SIZE="$available"
            export BUILT_WINDOW_TESTS=1
          else
            code=$?
            case "$code" in
              77) export BUILT_CI_SKIP_WINDOWS="Runner lacks a console window session" ;;
              78) export BUILT_CI_SKIP_GPU="Runner lacks a Metal device"
                  export BUILT_CI_SKIP_WINDOWS="$BUILT_CI_SKIP_GPU" ;;
              *) exit "$code" ;;
            esac
            echo "::notice::$BUILT_CI_SKIP_WINDOWS; window tests will be marked skipped."
          fi
          .venv/bin/python -m pytest -n auto --dist loadfile -q -rs ${{ inputs.tests || 'tests' }}

      - name: Run the Linux non-window tier and check the launcher
        if: runner.os == 'Linux' && !inputs.tests
        run: |
          .venv/bin/python -m pytest -n auto --dist loadfile -q -m "not slow and not window" tests
          cargo check --locked --manifest-path rust/built_app/Cargo.toml

      - name: Run the selected tests
        if: runner.os == 'Linux' && inputs.tests
        run: .venv/bin/python -m pytest -n auto --dist loadfile -q -rs ${{ inputs.tests }}

      - name: Rust library tests
        if: runner.os != 'Windows' && !inputs.tests
        run: |
          crates=(built_core built_render python_bindings)
          if [[ "$RUNNER_OS" == macOS ]]; then crates+=(built_rfa); fi
          # Their own directory: the tests build PyO3 without the extension
          # settings the wheels use, and sharing one would rebuild both.
          for crate in "${crates[@]}"; do
            cargo test --release --lib --target-dir "$CARGO_TARGET_DIR/lib-tests" --manifest-path "rust/$crate/Cargo.toml"
          done

      - name: Build and check Built.app
        if: runner.os == 'macOS' && !inputs.tests
        run: |
          BUILT_CARGO_TARGET_DIR="$CARGO_TARGET_DIR" packaging/build-macos-native.sh "$RUNNER_TEMP/bundle"
          .venv/bin/python scripts/isolated_launch.py "$RUNNER_TEMP/bundle/Built.app/Contents/MacOS/built" --check

      # Last, so the test and bundle builds are kept too; also after a failed
      # test step, which changes nothing in what was compiled.
      - uses: actions/cache/save@v4
        if: runner.os != 'Windows' && steps.target.outputs.cache-hit != 'true' && !cancelled() && !inputs.tests
        with:
          path: built/rust/built_app/target
          key: ${{ steps.target.outputs.cache-primary-key }}
