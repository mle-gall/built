# SPDX-License-Identifier: GPL-3.0-or-later
# Build the Linux AppImage + tarball on a tag and attach them to the release.
# (The Windows installer is build-windows.yml; both fire on the same tag.)
#
# Runs on ubuntu-22.04 on purpose: an AppImage links against the glibc of the
# machine that built it, so building on the newest runner would produce a file
# that only starts on the newest distros. 22.04 covers 22.04, 24.04 and 26.04.
name: release-linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # so the pipeline can be exercised without a tag

permissions:
  contents: write           # to upload the assets to the release

# The bundle's --check fails if the Rust engine is missing (core._native).
env:
  BUILT_BACKGROUND: "1"
  BUILT_REQUIRE_RUST: "1"

jobs:
  appimage:
    name: AppImage + tarball (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        run: |
          sudo apt-get update -qq
          # Winit uses the system display libraries. Mesa supplies the offscreen Vulkan device.
          sudo apt-get install -y --no-install-recommends \
            curl file libgtk-3-dev libwayland-dev libxkbcommon-x11-0 \
            libfuse2 xvfb libvulkan1 mesa-vulkan-drivers

      - name: Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --quiet --upgrade pip
          ./venv/bin/python -m pip install --quiet numpy pytest pyinstaller 'ezdxf>=1.4.4' 'manifold3d>=3.5.3'
          # openskp: UPSTREAM main — every Built patch is merged there
          # (legacy corpus 186/186 PRs #194/#199, annotations write+read
          # PR #203). Pinned by SHA like build-windows.yml so both
          # installers ship the same reader/writer; advance the SHA when
          # upstream lands something we need.
          ./venv/bin/python -m pip install --quiet "openskp @ git+https://github.com/iamahsanmehmood/openskp@291700bc213655a00461838de71e5f206311e619#subdirectory=packages/python"
          ./venv/bin/python -c "import openskp, openskp.legacy; print('openskp OK')"

      # The Rust engine (rust/built_core, Preferences ▸
      # General; on by default since 0.5.10). A build that cannot compile it fails here
      # instead of shipping without it.
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust engine
        run: |
          ./venv/bin/python -m pip install --quiet maturin
          ./venv/bin/maturin build --release -m rust/built_core/Cargo.toml -o "$RUNNER_TEMP/wheels"
          ./venv/bin/python -m pip install "$RUNNER_TEMP"/wheels/built_core-*.whl
          CARGO_PROFILE_RELEASE_STRIP=none ./venv/bin/maturin build --release --features extension-module -m rust/built_render/Cargo.toml -o "$RUNNER_TEMP/wheels"
          ./venv/bin/python -m pip install "$RUNNER_TEMP"/wheels/built_render-*.whl
          BUILT_RUST=1 ./venv/bin/python -c "import core._native as n; assert n.native is not None; print('engine:', n.engine())"

      - name: Tests
        # The slow marker is long fuzz sweeps; the release gate is the fast set,
        # in batches (one process each: the whole set no longer fits in a
        # runner's memory — scripts/pytest_batches.py).
        run: ./venv/bin/python scripts/pytest_batches.py -m "not slow" tests

      - name: Build the AppImage and the tarball
        run: packaging/build-appimage.sh dist

      # build-appimage.sh already ran --check on the bundle and on the
      # AppImage. This is the harder question: does it start a real GUI?
      - name: Smoke test with a display
        run: |
          APP=$(ls dist/Built-*-x86_64.AppImage)
          python3 scripts/isolated_launch.py xvfb-run -a timeout 60 "$APP" --measure \
            "$PWD/tests/fixtures/shell/slab-and-cube.igz" | tee smoke.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          log = Path("smoke.log").read_text().splitlines()
          frame = json.loads(next(line.removeprefix("[built] measure ") for line in log if line.startswith("[built] measure ")))
          assert frame["first_frame_ms"] >= 0 and frame["state"]["instances"] > 0
          PY

      # The tarball is the same bundle without the AppImage wrapper. Prove it
      # runs after extraction, not just that it was packed.
      - name: Smoke test the tarball
        run: |
          mkdir -p tarcheck && tar -C tarcheck -xzf dist/Built-*-linux-x86_64.tar.gz
          python3 scripts/isolated_launch.py tarcheck/Built-*/built --check

      - uses: actions/upload-artifact@v4
        with:
          name: Built-AppImage-x86_64
          path: dist/Built-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Built-tarball-x86_64
          path: dist/Built-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release usually exists already (created by hand with notes, or
          # by build-windows.yml); create a bare one only if we got here first.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "Built ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            dist/Built-*-x86_64.AppImage \
            dist/Built-*-linux-x86_64.tar.gz --clobber
          # The example documents, under a name without the version so the
          # website can point at .../releases/latest/download/ for good.
          (cd examples && zip -q -r ../Built-ejemplos.zip .)
          gh release upload "${GITHUB_REF_NAME}" Built-ejemplos.zip --clobber
  snap:
    name: Snap (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            file libgtk-3-dev libwayland-dev libxkbcommon-x11-0 libvulkan1

      - name: Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --quiet --upgrade pip
          ./venv/bin/python -m pip install --quiet numpy pyinstaller 'manifold3d>=3.5.3'
          ./venv/bin/python -m pip install --quiet "openskp @ git+https://github.com/iamahsanmehmood/openskp@291700bc213655a00461838de71e5f206311e619#subdirectory=packages/python"

      # The Rust engine (rust/built_core, Preferences ▸
      # General; on by default since 0.5.10). A build that cannot compile it fails here
      # instead of shipping without it.
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust engine
        run: |
          ./venv/bin/python -m pip install --quiet maturin
          ./venv/bin/maturin build --release -m rust/built_core/Cargo.toml -o "$RUNNER_TEMP/wheels"
          ./venv/bin/python -m pip install "$RUNNER_TEMP"/wheels/built_core-*.whl
          CARGO_PROFILE_RELEASE_STRIP=none ./venv/bin/maturin build --release --features extension-module -m rust/built_render/Cargo.toml -o "$RUNNER_TEMP/wheels"
          ./venv/bin/python -m pip install "$RUNNER_TEMP"/wheels/built_render-*.whl
          BUILT_RUST=1 ./venv/bin/python -c "import core._native as n; assert n.native is not None; print('engine:', n.engine())"

      - name: Build the PyInstaller bundle
        run: |
          ./venv/bin/python -m PyInstaller --noconfirm packaging/native.spec
          PYO3_PYTHON="$PWD/venv/bin/python" packaging/install-native-launcher.sh dist/built
          python3 scripts/isolated_launch.py dist/built/built --check

      - name: Stage the snap tree
        run: |
          VERSION=$(./venv/bin/python -c 'from core.version import __version__; print(__version__)')
          mkdir -p build/snap-stage/snap/gui build/snap-stage/payload
          sed "s/@VERSION@/$VERSION/" packaging/snap/snapcraft.yaml.in \
            > build/snap-stage/snap/snapcraft.yaml
          cp -a dist/built/. build/snap-stage/payload/
          cp resources/icons/built_256.png build/snap-stage/snap/gui/built.png
          # Desktop entry: same as the tarball's, with the snap's icon path.
          sed -e 's|^Exec=built |Exec=built |' -e 's|^Icon=.*|Icon=${SNAP}/meta/gui/built.png|' \
              packaging/built.desktop > build/snap-stage/snap/gui/built.desktop

      - name: Build the snap
        id: snapbuild
        uses: snapcore/action-build@v1
        with:
          path: build/snap-stage

      # --check proves the confined bundle still finds its own data (the
      # same gate the AppImage passes); a GUI smoke needs a session bus the
      # runner lacks under confinement, so data integrity is the gate here.
      - name: Smoke test the snap
        run: |
          sudo snap install --dangerous "${{ steps.snapbuild.outputs.snap }}"
          python3 scripts/isolated_launch.py snap run built --check

      - uses: actions/upload-artifact@v4
        with:
          name: Built-snap-x86_64
          path: ${{ steps.snapbuild.outputs.snap }}
          if-no-files-found: error
          retention-days: 7

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "Built ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.snapbuild.outputs.snap }}" --clobber

      # Publishes to the Snap Store ONLY when the repository carries the
      # credential (snapcraft export-login → secret SNAPCRAFT_STORE_CREDENTIALS
      # — and the name must be registered once: `snapcraft register built`).
      # Without it the job still succeeds with the .snap as a release asset.
      - name: Publish to the Snap Store (if credentials exist)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "Sin SNAPCRAFT_STORE_CREDENTIALS — se omite la publicación."
            exit 0
          fi
          sudo snap install snapcraft --classic
          snapcraft upload "${{ steps.snapbuild.outputs.snap }}" --release=stable
