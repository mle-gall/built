[pytest]
minversion = 9.1
# A blocked native call can prevent Python signal handlers from running.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
markers =
    window_size(w, h): scripted pointer positions require this logical window size
    slow: long fuzz sweeps, real-size data and external programs; deselect with -m "not slow" for the fast suite
    blender: launches a real Blender process; enable with BUILT_BLENDER_TESTS=1
    window: set by tests/conftest.py on files that build an application window; the quick subset is -m "not slow and not window"
