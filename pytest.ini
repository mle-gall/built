[pytest]
minversion = 9.1
# A blocked native call can prevent Python signal handlers from running.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
markers =
    slow: long fuzz sweeps, real-size data and external programs; deselect with -m "not slow" for the fast suite
    window: set by tests/conftest.py on files that build an application window; the delegate subset is -m "not slow and not window"
    classic_pending: behavior awaiting a native replacement test, listed in docs/classic-pending.md
